# Make the branding assets revalidate on every request.
#
# The base image sends no Cache-Control at all for static files, only ETag and
# Last-Modified. With no explicit lifetime a browser falls back to the heuristic of
# RFC 9111 section 4.2.2 — roughly a tenth of the age of the response — so a logo that
# had not been touched for weeks stayed fresh in every browser for days. Replacing the
# SECONV-RR logos then reached nobody: the file on disk changed, the URL did not, and
# no purge can evict a copy a browser already holds.
#
# "no-cache" does not forbid storing the file; it forces the browser to revalidate
# before using it. With the ETag the base image already sends, the normal answer is a
# 304 with no body, so this costs a conditional request and buys immediate propagation
# the next time public/pics changes.
<IfModule mod_headers.c>
    <LocationMatch "^/pics/">
        Header set Cache-Control "no-cache"
    </LocationMatch>
</IfModule>
