# SECONV_OIDC=optional: Zitadel and the local login form side by side.
Include /etc/apache2/seconv-oidc/provider.inc

# "pass" lets a request without a Zitadel session through with no REMOTE_USER, so GLPI shows
# its own login form as usual. A request that does carry a session gets REMOTE_USER, and
# GLPI logs that user in from the login page without asking for anything.
<Location />
    AuthType openid-connect
    Require valid-user
    OIDCUnAuthAction pass
</Location>

# The way into Zitadel in this mode: open /oidc/login. It demands a session, which sends the
# browser to the Zitadel login page; the module then returns here, and the page forwards to
# the GLPI login page above. It is a static file because a Redirect in this block would be
# applied before authentication and skip the login altogether.
Alias /oidc/login /etc/apache2/seconv-oidc/login.html
<Location /oidc/login>
    OIDCUnAuthAction auth
</Location>
