# Turns Zitadel single sign-on on when the container runs with SECONV_OIDC=on.
#
# Apache has no conditional that reads the process environment at configuration time, but it
# does expand ${VAR} in any directive. So the variable picks the file: "on" resolves to
# /etc/apache2/seconv-oidc/on.conf, and anything else (unset included) to a path that does
# not exist, which IncludeOptional skips. Unset leaves an AH00111 warning in the log and
# nothing else.
IncludeOptional /etc/apache2/seconv-oidc/${SECONV_OIDC}.conf
